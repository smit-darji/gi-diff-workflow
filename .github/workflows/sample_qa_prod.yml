name: PROD - New Sync Airflow DAG to S3
on:
  release:
    types: [published, edited]
    branches:
      - Master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  PROD-deploy:
    runs-on: windows-latest
    environment:
      name: PROD
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
           
      - name: Get the last two releases
        id: get_releases
        shell: bash
        run: |
          echo "Fetching latest releases..."
          RELEASES=$(gh release list --limit 2 --json tagName --jq '.[].tagName')

          echo "==================="
          echo "$RELEASES"
          echo "==================="

          CURRENT_RELEASE=$(echo "$RELEASES" | head -n 1)
          PREV_RELEASE=$(echo "$RELEASES" | tail -n 1)

          echo "CURRENT_RELEASE=$CURRENT_RELEASE" >> $GITHUB_ENV
          echo "PREV_RELEASE=$PREV_RELEASE" >> $GITHUB_ENV

          echo "New Release: $CURRENT_RELEASE"
          echo "Previous Release: $PREV_RELEASE"

      - name: Check if config/requirements_2.7.2.txt is modified
        id: check-file-modified
        run: |
          if [[ -n "${{ env.PREV_TAG }}" ]]; then
            if git diff --name-only ${{ env.PREV_TAG }} ${{ env.CURRENT_TAG }} -- 'config/requirements_2.7.2.txt' | grep -q 'config/requirements_2.7.2.txt'; then
              echo "File config/requirements_2.7.2.txt is modified"
              echo "FILE_MODIFIED=true" >> $GITHUB_ENV
            else
              echo "File config/requirements_2.7.2.txt is not modified"
              echo "FILE_MODIFIED=false" >> $GITHUB_ENV
            fi
          else
            echo "No previous tag to compare"
            echo "FILE_MODIFIED=false" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Zip Lambda Function
        run: .github\workflows\dag_build.ps1
        shell: powershell

     

      - name: prit temp file list
        run: |
          cd ./temp/dna-datalake-airflow/config
          ls 
          
